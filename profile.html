<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Hannah - Hannah Ryu</title>
  <link rel="icon" href="web_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #ffc2d1;
      --pink-soft: #ffe4ec;
      --dark: #1a1a1a;
      --gray: #666;
      --light-gray: #f5f5f5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #ffffff;
      color: var(--dark);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      padding: 40px 20px;
      cursor: none;
      transition: background 0.3s ease, color 0.3s ease;
    }

    body.dark-mode {
      background: #1a1a1a;
      color: #e0e0e0;
    }

    body.dark-mode .profile-content,
    body.dark-mode .intro-text {
      color: #b0b0b0;
    }

    body.dark-mode .nav-group {
      background: rgba(50, 50, 50, 0.6);
    }

    body.dark-mode .nav-item a,
    body.dark-mode .nav-item button {
      color: #b8d4a8;
    }

    body.dark-mode .nav-item a.active {
      background: rgba(184, 212, 168, 0.2);
      color: #b8d4a8;
    }

    /* Navigation */
    .top-nav {
      position: fixed;
      left: 24px;
      top: 24px;
      z-index: 1000;
    }

    .nav-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
      background: rgba(255, 240, 245, 0.6);
      border-radius: 24px;
      backdrop-filter: blur(8px);
      box-shadow: 0 2px 12px rgba(255, 194, 209, 0.15);
    }

    .nav-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-item a,
    .nav-item button {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
      color: #b8d4a8;
      text-decoration: none;
    }

    .nav-item a:hover,
    .nav-item button:hover {
      background: rgba(255, 194, 209, 0.2);
      transform: translateY(-2px);
    }

    .nav-item a.active {
      background: rgba(255, 194, 209, 0.35);
      color: #ff9ab7;
    }

    .nav-item svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .nav-tooltip {
      position: absolute;
      left: 56px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 240, 245, 0.95);
      color: #ff9ab7;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      box-shadow: 0 2px 8px rgba(255, 194, 209, 0.2);
    }

    .nav-item:hover .nav-tooltip {
      opacity: 1;
    }

    .cursor-glow {
      position: fixed;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 194, 209, 0.6), rgba(255, 194, 209, 0.2), transparent);
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 9999;
      transition: width 0.2s ease, height 0.2s ease;
      box-shadow: 0 0 20px rgba(255, 194, 209, 0.5);
    }

    .cursor-glow.clicking {
      width: 30px;
      height: 30px;
      background: radial-gradient(circle, rgba(255, 194, 209, 0.8), rgba(255, 194, 209, 0.3), transparent);
      box-shadow: 0 0 30px rgba(255, 194, 209, 0.7);
    }

    .profile-container {
      max-width: 1100px;
      margin: 120px auto 0;
      display: flex;
      align-items: center;
      gap: 48px;
      padding: 20px;
    }

    .profile-photo-wrap {
      flex: 0 0 auto;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--gray);
      font-size: 0.9rem;
      margin-bottom: 32px;
      transition: color 0.3s ease;
    }

    .back-button:hover {
      color: var(--pink);
    }

    .profile-image {
      width: 420px;
      max-width: 100%;
      aspect-ratio: 8 / 9;
      height: auto;
      object-fit: cover;
      border-radius: 0;
      border: 4px solid var(--pink-soft);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
    }

    .profile-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      font-weight: 500;
      margin: 0;
    }

    .intro-text {
      font-size: 1.05rem;
      line-height: 1.8;
      color: var(--gray);
      max-width: 620px;
    }

    @media (max-width: 768px) {
      .profile-container {
        flex-direction: column;
        text-align: center;
        padding: 0;
      }

      .profile-content {
        align-items: center;
      }

      .intro-text {
        font-size: 1rem;
      }

      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <nav class="top-nav">
    <div class="nav-group">
      <div class="nav-item">
        <a href="index.html">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </a>
        <span class="nav-tooltip">Home</span>
      </div>
      <div class="nav-item">
        <a href="profile.html" class="active">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </a>
        <span class="nav-tooltip">About</span>
      </div>
      <div class="nav-item">
        <a href="index.html#projects">
          <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-1 6h-3v3h-2v-3h-3v-2h3V7h2v3h3v2z"/></svg>
        </a>
        <span class="nav-tooltip">Projects</span>
      </div>
      <div class="nav-item">
        <a href="https://drive.google.com/file/d/1chkTfM3D4EdmaqGy6iQ49eBCMgDzItPG/view?usp=sharing" target="_blank" rel="noreferrer">
          <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
        </a>
        <span class="nav-tooltip">Resume</span>
      </div>
      <div class="nav-item">
        <button id="theme-toggle" aria-label="Toggle dark mode">
          <svg viewBox="0 0 24 24"><path d="M9 2c-1.05 0-2.05.16-3 .46 4.06 1.27 7 5.06 7 9.54 0 4.48-2.94 8.27-7 9.54.95.3 1.95.46 3 .46 5.52 0 10-4.48 10-10S14.52 2 9 2z"/></svg>
        </button>
        <span class="nav-tooltip">Dark Mode</span>
      </div>
    </div>
  </nav>

  <div class="profile-container">
    <div class="profile-content">
      <h1>Hi, I'm Hannah!</h1>
      <p class="intro-text">
        I'm passionate about tackling problems in healthcare with data science and machine learning. My work spans clinical data analysis, AI-driven methods, and research-based methods, with a focus on building scalable, impactful tools.
      </p>
    </div>

    <div class="profile-photo-wrap">
      <img src="profile-photo-converted.jpg" alt="Hannah Ryu" class="profile-image">
    </div>
  </div>

  <script>
    // Custom cursor glow
    const cursorGlow = document.createElement('div');
    cursorGlow.className = 'cursor-glow';
    document.body.appendChild(cursorGlow);

    document.addEventListener('mousemove', (e) => {
      cursorGlow.style.left = e.clientX + 'px';
      cursorGlow.style.top = e.clientY + 'px';
    });

    document.addEventListener('mousedown', () => {
      cursorGlow.classList.add('clicking');
    });

    document.addEventListener('mouseup', () => {
      cursorGlow.classList.remove('clicking');
    });

    // Dark mode toggle
    const themeToggle = document.getElementById('theme-toggle');
    const body = document.body;
    
    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-mode');
      const isDark = body.classList.contains('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      
      // Update icon
      themeToggle.innerHTML = isDark 
        ? '<svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>'
        : '<svg viewBox="0 0 24 24"><path d="M9 2c-1.05 0-2.05.16-3 .46 4.06 1.27 7 5.06 7 9.54 0 4.48-2.94 8.27-7 9.54.95.3 1.95.46 3 .46 5.52 0 10-4.48 10-10S14.52 2 9 2z"/></svg>';
    });

    // Load saved theme
    if (localStorage.getItem('theme') === 'dark') {
      body.classList.add('dark-mode');
      themeToggle.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>';
    }
  </script>
</body>
</html>
